sensor_ekf:
  ros__parameters:
    use_sim_time: true
    frequency: 20.0
    sensor_timeout: 0.25
    two_d_mode: false
    publish_tf: false
    print_diagnostics: true
    map_frame: map
    odom_frame: odom
    base_link_frame: wamv/wamv/base_link
    world_frame: odom
    transform_timeout: 0.0
    odom0: /nav/localization/gps
    odom0_config: [true, true, true, false, false, false,
                   false, false, false, false, false, false, false, false, false]
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false
    imu0: /nav/localization/imu
    imu0_config: [false, false, false, true, true, true,
                  false, false, false, true, true, true, false, false, false]
    imu0_queue_size: 20
    imu0_differential: false
    imu0_relative: false
    # No double integration of biased accelerometer data. Velocity is inferred
    # by the EKF motion model from position observations, not assumed zero sway.
    imu0_remove_gravitational_acceleration: false

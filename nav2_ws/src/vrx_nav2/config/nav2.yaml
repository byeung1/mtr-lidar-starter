# ROS 2 Jazzy. Default water prior: 200 x 200 m; original demo map remains selectable.
map_server:
  ros__parameters:
    use_sim_time: true
    topic_name: map
    frame_id: map
planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 0.5
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_smac_planner::SmacPlannerHybrid
      tolerance: 0.75
      downsample_costmap: false
      allow_unknown: false
      max_iterations: 100000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      motion_model_for_search: DUBIN
      angle_quantization_bins: 72
      minimum_turning_radius: 4.0
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 12.0
      reverse_penalty: 10.0
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 3.0
      retrospective_penalty: 0.015
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      smooth_path: true
controller_server:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false
    controller_frequency: 5.0
    costmap_update_timeout: 2.0
    min_x_velocity_threshold: 0.005
    min_y_velocity_threshold: 0.005
    min_theta_velocity_threshold: 0.005
    failure_tolerance: 0.0
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    odom_topic: /nav/odom
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.3
      movement_time_allowance: 40.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.8
      yaw_goal_tolerance: 0.7
      stateful: true
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      # Conservative tracking profile: avoid wide repeated passes near a goal.
      desired_linear_vel: 0.25
      lookahead_dist: 3.0
      min_lookahead_dist: 1.25
      max_lookahead_dist: 2.5
      lookahead_time: 4.0
      use_velocity_scaled_lookahead_dist: true
      transform_tolerance: 0.3
      use_rotate_to_heading: false
      allow_reversing: false
      max_angular_accel: 0.05
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 5.0
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 6.0
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 4.0
      regulated_linear_scaling_min_speed: 0.1
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 1.5
      cost_scaling_gain: 0.5
      inflation_cost_scaling_factor: 1.5
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 3.0
      # Aim at the actual path endpoint rather than extending beyond it.
      interpolate_curvature_after_goal: false
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: nav_base
      rolling_window: true
      width: 24
      height: 24
      resolution: 0.25
      update_frequency: 3.0
      publish_frequency: 1.0
      transform_tolerance: 0.5
      track_unknown_space: true
      footprint: '[[-3.1,-1.4],[2.7,-1.4],[2.7,1.4],[-3.1,1.4]]'
      footprint_padding: 0.2
      always_send_full_costmap: true
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        footprint_clearing_enabled: true
        observation_sources: lidar
        lidar:
          topic: /nav/points
          sensor_frame: wamv/wamv/base_link/lidar_wamv_sensor
          data_type: PointCloud2
          marking: true
          clearing: true
          min_obstacle_height: 0.35
          max_obstacle_height: 3.5
          obstacle_min_range: 0.1
          obstacle_max_range: 30.0
          raytrace_min_range: 0.1
          raytrace_max_range: 35.0
          expected_update_rate: 1.5
          observation_persistence: 0.0
          inf_is_valid: false
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 4.0
        cost_scaling_factor: 1.5
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: nav_base
      rolling_window: false
      resolution: 0.25
      update_frequency: 2.0
      publish_frequency: 1.0
      transform_tolerance: 0.5
      track_unknown_space: true
      footprint: '[[-3.1,-1.4],[2.7,-1.4],[2.7,1.4],[-3.1,1.4]]'
      footprint_padding: 0.2
      always_send_full_costmap: true
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: lidar
        lidar:
          topic: /nav/points
          sensor_frame: wamv/wamv/base_link/lidar_wamv_sensor
          data_type: PointCloud2
          marking: true
          clearing: true
          min_obstacle_height: 0.35
          max_obstacle_height: 3.5
          obstacle_min_range: 0.1
          obstacle_max_range: 30.0
          raytrace_min_range: 0.1
          raytrace_max_range: 35.0
          expected_update_rate: 1.5
          observation_persistence: 0.0
          inf_is_valid: false
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 4.0
        cost_scaling_factor: 1.5
bt_navigator:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false
    global_frame: map
    robot_base_frame: nav_base
    odom_topic: /nav/odom
    transform_tolerance: 0.5
    bt_loop_duration: 100
    default_server_timeout: 1000
    navigators: [navigate_to_pose, navigate_through_poses]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator
waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 10
    stop_on_failure: true
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 1000
